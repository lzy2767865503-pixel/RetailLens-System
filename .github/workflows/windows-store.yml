name: Build and verify Microsoft Store AppX

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retaillens-production-store-validation
  cancel-in-progress: false

jobs:
  build-and-test-exact-appx:
    name: Two WACK and lifecycle rounds on one exact temporary-signed AppX
    if: github.repository_owner == 'lzy2767865503-pixel' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - retaillens-wack
      - interactive
      - elevated
    timeout-minutes: 240
    environment: microsoft-store
    permissions:
      contents: read
    env:
      RETAILLENS_STORE_IDENTITY_NAME: LAIZEYU.RetailDecisionStudiobyLAIZEYU
      RETAILLENS_STORE_PUBLISHER: CN=A5F91D0A-30C6-48EE-944F-B767FA872BE8
      RETAILLENS_STORE_PRODUCT_ID: 9NVNLQWQBKHD
      RETAILLENS_RESERVED_IDENTITY_NAME: ${{ vars.RETAILLENS_WINDOWS_IDENTITY_NAME }}
      RETAILLENS_RESERVED_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
      RETAILLENS_CERTIFICATION_NOTES_PRIVATE: ${{ vars.RETAILLENS_CERTIFICATION_NOTES_PRIVATE }}
      RETAILLENS_CERTIFICATION_DEDICATED_KEY_READY: ${{ vars.RETAILLENS_CERTIFICATION_DEDICATED_KEY_READY }}
      RETAILLENS_CERTIFICATION_KEY_LIMITED: ${{ vars.RETAILLENS_CERTIFICATION_KEY_LIMITED }}
      RETAILLENS_CERTIFICATION_KEY_REVOCABLE: ${{ vars.RETAILLENS_CERTIFICATION_KEY_REVOCABLE }}
      RETAILLENS_CERTIFICATION_KEY_EXPIRES_ON: ${{ vars.RETAILLENS_CERTIFICATION_KEY_EXPIRES_ON }}
      RETAILLENS_CERTIFICATION_OPENAI_ENDPOINT: ${{ vars.RETAILLENS_CERTIFICATION_OPENAI_ENDPOINT }}
      RETAILLENS_CERTIFICATION_OPENAI_CONNECTION_ENDPOINT: ${{ vars.RETAILLENS_CERTIFICATION_OPENAI_CONNECTION_ENDPOINT }}
      RETAILLENS_CERTIFICATION_OPENAI_MODEL: ${{ vars.RETAILLENS_CERTIFICATION_OPENAI_MODEL }}
      RETAILLENS_CERTIFICATION_CONNECTION_STEPS_READY: ${{ vars.RETAILLENS_CERTIFICATION_CONNECTION_STEPS_READY }}
      RETAILLENS_CERTIFICATION_INTERPRETATION_STEPS_READY: ${{ vars.RETAILLENS_CERTIFICATION_INTERPRETATION_STEPS_READY }}
      RETAILLENS_CERTIFICATION_LIVE_API_CHECK_REQUIRED: ${{ vars.RETAILLENS_CERTIFICATION_LIVE_API_CHECK_REQUIRED }}
      RETAILLENS_GENERATIVE_AI_DECLARED: ${{ vars.RETAILLENS_GENERATIVE_AI_DECLARED }}
      RETAILLENS_AUTOMATIC_BACKUP_DISABLED: ${{ vars.RETAILLENS_AUTOMATIC_BACKUP_DISABLED }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out protected main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require canonical owner and exact current remote main before any secret use
        shell: pwsh
        run: |
          if ('${{ github.repository }}' -cne 'lzy2767865503-pixel/RetailLens-System') {
            throw 'Store validation is restricted to the canonical repository'
          }
          if (
            $env:RETAILLENS_RESERVED_IDENTITY_NAME -cne $env:RETAILLENS_STORE_IDENTITY_NAME -or
            $env:RETAILLENS_RESERVED_PUBLISHER -cne $env:RETAILLENS_STORE_PUBLISHER
          ) { throw 'Protected Partner Center variables differ from the immutable production identity' }
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch current remote main' }
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $remoteMain = (git rev-parse refs/remotes/origin/main).Trim().ToLowerInvariant()
          if ($head -cne $remoteMain -or $head -cne '${{ github.sha }}'.ToLowerInvariant()) {
            throw 'Store validation must execute the exact current protected main commit'
          }
          $statePath = Join-Path $env:RUNNER_TEMP 'retaillens-store-${{ github.run_id }}-${{ github.run_attempt }}.json'
          if (Test-Path -LiteralPath $statePath) {
            throw 'Run-unique Store state unexpectedly pre-exists'
          }
          "RETAILLENS_STORE_STATE_PATH=$statePath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install locked dependencies and run source/certification gates
        run: |
          pnpm install --frozen-lockfile
          node scripts/validate-store-env.mjs
          node scripts/validate-certification-gates.mjs
          pnpm audit:prod
          pnpm audit:all
          pnpm test
          pnpm metadata:attribution
          pnpm metadata:notices:check
          pnpm metadata:sbom
          ./scripts/windows-signer-policy.test.ps1
          ./scripts/windows-file-policy.test.ps1
          ./scripts/windows-staging-policy.test.ps1
          ./scripts/windows-wack-policy.test.ps1
          ./scripts/windows-workflow-powershell-ast.test.ps1
          pnpm test:desktop

      - name: Build exact unsigned production-identity AppX
        run: pnpm package:store

      - name: Preflight, inspect exact manifest, create one non-exportable certificate, sign once, and destroy unsigned source
        shell: pwsh
        run: |
          ./scripts/windows-prepare-store-candidate.ps1 `
            -StatePath $env:RETAILLENS_STORE_STATE_PATH `
            -IdentityName $env:RETAILLENS_STORE_IDENTITY_NAME `
            -Publisher $env:RETAILLENS_STORE_PUBLISHER
          $state = Get-Content $env:RETAILLENS_STORE_STATE_PATH -Raw | ConvertFrom-Json
          "RETAILLENS_STORE_CANDIDATE_SHA256=$($state.candidateSha256)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RETAILLENS_STORE_RUN_ROOT=$($state.runRoot)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bind Round 1 live OpenAI capability to this exact Store commit/model/candidate
        shell: pwsh
        env:
          RETAILLENS_CERTIFICATION_OPENAI_API_KEY: ${{ secrets.RETAILLENS_CERTIFICATION_OPENAI_API_KEY }}
          RETAILLENS_CERTIFICATION_COMMIT_SHA: ${{ github.sha }}
          RETAILLENS_CERTIFICATION_ROUND: "1"
        run: |
          $state = Get-Content $env:RETAILLENS_STORE_STATE_PATH -Raw | ConvertFrom-Json
          if ((Get-FileHash $state.candidatePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:RETAILLENS_STORE_CANDIDATE_SHA256) {
            throw 'Store OpenAI Round 1 preflight candidate bytes are not exact'
          }
          $env:RETAILLENS_CERTIFICATION_CANDIDATE_SHA256 = $env:RETAILLENS_STORE_CANDIDATE_SHA256
          $path = Join-Path $env:RETAILLENS_STORE_RUN_ROOT 'OPENAI_CERTIFICATION_ROUND_1.json'
          node scripts/validate-openai-certification.mjs $path
          $evidence = Get-Content $path -Raw | ConvertFrom-Json
          if (
            $evidence.schemaVersion -ne 2 -or
            $evidence.commitSha -cne '${{ github.sha }}' -or
            $evidence.candidateSha256 -cne $env:RETAILLENS_STORE_CANDIDATE_SHA256 -or
            $evidence.model -cne $env:RETAILLENS_CERTIFICATION_OPENAI_MODEL -or
            $evidence.certificationRound -cne '1' -or
            $evidence.nonceSha256 -notmatch '^[0-9a-f]{64}$' -or
            $evidence.responseIdSha256 -notmatch '^[0-9a-f]{64}$'
          ) { throw 'Store OpenAI Round 1 is not bound to the exact commit/model/candidate' }
          $completedAt = [DateTimeOffset]$evidence.completedAt
          if (
            $completedAt -gt [DateTimeOffset]::UtcNow.AddMinutes(2) -or
            $completedAt -lt [DateTimeOffset]::UtcNow.AddMinutes(-2)
          ) { throw 'Store OpenAI Round 1 timestamp is not fresh' }
          if ((Get-FileHash $state.candidatePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:RETAILLENS_STORE_CANDIDATE_SHA256) {
            throw 'Store OpenAI Round 1 candidate changed during the live call'
          }
          "RETAILLENS_STORE_OPENAI_MODEL=$($evidence.model)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RETAILLENS_STORE_OPENAI_NONCE_1=$($evidence.nonceSha256)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RETAILLENS_STORE_OPENAI_RESPONSE_1=$($evidence.responseIdSha256)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RETAILLENS_STORE_OPENAI_COMPLETED_1=$($evidence.completedAt)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: WACK round 1 on the exact temporary-signed candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RETAILLENS_STORE_RUN_ROOT 'wack-round-1'
          ./scripts/windows-wack.ps1 `
            -StatePath $env:RETAILLENS_STORE_STATE_PATH -Round 1 `
            -ReportPath (Join-Path $root 'WACK-report.xml') `
            -StatusPath (Join-Path $root 'WACK-status.txt') `
            -RunRecordPath (Join-Path $root 'WACK-private-run-record.json') `
            -Repository '${{ github.repository }}' -CommitSha '${{ github.sha }}' `
            -WorkflowRef '${{ github.workflow_ref }}' `
            -WorkflowRunId '${{ github.run_id }}' -WorkflowRunAttempt '${{ github.run_attempt }}' `
            -ResetTimeoutSeconds 300 -TestTimeoutSeconds 3600

      - name: Immediately verify WACK round 1 private same-run record
        shell: pwsh
        run: |
          $root = Join-Path $env:RETAILLENS_STORE_RUN_ROOT 'wack-round-1'
          ./scripts/windows-verify-wack-run-record.ps1 `
            -StatePath $env:RETAILLENS_STORE_STATE_PATH `
            -ReportPath (Join-Path $root 'WACK-report.xml') `
            -RunRecordPath (Join-Path $root 'WACK-private-run-record.json') `
            -ExpectedRound 1 -ExpectedRepository '${{ github.repository }}' `
            -ExpectedCommitSha '${{ github.sha }}' -ExpectedWorkflowRef '${{ github.workflow_ref }}' `
            -ExpectedWorkflowRunId '${{ github.run_id }}' -ExpectedWorkflowRunAttempt '${{ github.run_attempt }}'

      - name: Remove any WACK round 1 package/process/data residue while preserving candidate and certificate
        if: always()
        shell: pwsh
        run: ./scripts/windows-store-cleanup.ps1 -StatePath $env:RETAILLENS_STORE_STATE_PATH -IdentityName $env:RETAILLENS_STORE_IDENTITY_NAME -RuntimeOnly

      - name: Lifecycle round 1 on the same exact candidate bytes
        shell: pwsh
        run: ./scripts/windows-store-lifecycle.ps1 -StatePath $env:RETAILLENS_STORE_STATE_PATH -Round 1

      - name: Bind independent Round 2 live OpenAI capability to the unchanged Store candidate
        shell: pwsh
        env:
          RETAILLENS_CERTIFICATION_OPENAI_API_KEY: ${{ secrets.RETAILLENS_CERTIFICATION_OPENAI_API_KEY }}
          RETAILLENS_CERTIFICATION_COMMIT_SHA: ${{ github.sha }}
          RETAILLENS_CERTIFICATION_ROUND: "2"
        run: |
          $state = Get-Content $env:RETAILLENS_STORE_STATE_PATH -Raw | ConvertFrom-Json
          if ((Get-FileHash $state.candidatePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:RETAILLENS_STORE_CANDIDATE_SHA256) {
            throw 'Store OpenAI Round 2 preflight candidate bytes are not exact'
          }
          $env:RETAILLENS_CERTIFICATION_CANDIDATE_SHA256 = $env:RETAILLENS_STORE_CANDIDATE_SHA256
          $path = Join-Path $env:RETAILLENS_STORE_RUN_ROOT 'OPENAI_CERTIFICATION_ROUND_2.json'
          node scripts/validate-openai-certification.mjs $path
          $evidence = Get-Content $path -Raw | ConvertFrom-Json
          if (
            $evidence.schemaVersion -ne 2 -or
            $evidence.commitSha -cne '${{ github.sha }}' -or
            $evidence.candidateSha256 -cne $env:RETAILLENS_STORE_CANDIDATE_SHA256 -or
            $evidence.model -cne $env:RETAILLENS_STORE_OPENAI_MODEL -or
            $evidence.certificationRound -cne '2' -or
            $evidence.nonceSha256 -notmatch '^[0-9a-f]{64}$' -or
            $evidence.responseIdSha256 -notmatch '^[0-9a-f]{64}$' -or
            $evidence.nonceSha256 -ceq $env:RETAILLENS_STORE_OPENAI_NONCE_1 -or
            $evidence.responseIdSha256 -ceq $env:RETAILLENS_STORE_OPENAI_RESPONSE_1
          ) { throw 'Store OpenAI probes are not two independent rounds bound to one commit/model/candidate' }
          $round1Time = [DateTimeOffset]$env:RETAILLENS_STORE_OPENAI_COMPLETED_1
          $round2Time = [DateTimeOffset]$evidence.completedAt
          if (
            $round2Time -le $round1Time -or
            $round2Time -gt [DateTimeOffset]::UtcNow.AddMinutes(2) -or
            $round2Time -lt [DateTimeOffset]::UtcNow.AddMinutes(-2)
          ) {
            throw 'Store OpenAI Round 2 timestamp is not fresh and later than Round 1'
          }
          if ((Get-FileHash $state.candidatePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:RETAILLENS_STORE_CANDIDATE_SHA256) {
            throw 'Store OpenAI Round 2 candidate changed during the live call'
          }

      - name: WACK round 2 on the unchanged exact temporary-signed candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RETAILLENS_STORE_RUN_ROOT 'wack-round-2'
          ./scripts/windows-wack.ps1 `
            -StatePath $env:RETAILLENS_STORE_STATE_PATH -Round 2 `
            -ReportPath (Join-Path $root 'WACK-report.xml') `
            -StatusPath (Join-Path $root 'WACK-status.txt') `
            -RunRecordPath (Join-Path $root 'WACK-private-run-record.json') `
            -Repository '${{ github.repository }}' -CommitSha '${{ github.sha }}' `
            -WorkflowRef '${{ github.workflow_ref }}' `
            -WorkflowRunId '${{ github.run_id }}' -WorkflowRunAttempt '${{ github.run_attempt }}' `
            -ResetTimeoutSeconds 300 -TestTimeoutSeconds 3600

      - name: Immediately verify WACK round 2 private same-run record and two-round identity
        shell: pwsh
        run: |
          $root = Join-Path $env:RETAILLENS_STORE_RUN_ROOT 'wack-round-2'
          ./scripts/windows-verify-wack-run-record.ps1 `
            -StatePath $env:RETAILLENS_STORE_STATE_PATH `
            -ReportPath (Join-Path $root 'WACK-report.xml') `
            -RunRecordPath (Join-Path $root 'WACK-private-run-record.json') `
            -ExpectedRound 2 -ExpectedRepository '${{ github.repository }}' `
            -ExpectedCommitSha '${{ github.sha }}' -ExpectedWorkflowRef '${{ github.workflow_ref }}' `
            -ExpectedWorkflowRunId '${{ github.run_id }}' -ExpectedWorkflowRunAttempt '${{ github.run_attempt }}'
          $round1 = Get-Content (Join-Path $env:RETAILLENS_STORE_RUN_ROOT 'wack-round-1/WACK-private-run-record.json') -Raw | ConvertFrom-Json
          $round2 = Get-Content (Join-Path $env:RETAILLENS_STORE_RUN_ROOT 'wack-round-2/WACK-private-run-record.json') -Raw | ConvertFrom-Json
          if (
            $round1.package.sha256 -cne $round2.package.sha256 -or
            $round1.package.sha256 -cne $env:RETAILLENS_STORE_CANDIDATE_SHA256 -or
            $round1.commitSha -cne $round2.commitSha -or
            $round1.runId -ceq $round2.runId -or
            [int]$round1.round -ne 1 -or [int]$round2.round -ne 2
          ) { throw 'WACK rounds are not two distinct runs on the same commit and exact candidate bytes' }

      - name: Remove any WACK round 2 package/process/data residue while preserving candidate and certificate
        if: always()
        shell: pwsh
        run: ./scripts/windows-store-cleanup.ps1 -StatePath $env:RETAILLENS_STORE_STATE_PATH -IdentityName $env:RETAILLENS_STORE_IDENTITY_NAME -RuntimeOnly

      - name: Lifecycle round 2 on the same exact candidate bytes
        shell: pwsh
        run: ./scripts/windows-store-lifecycle.ps1 -StatePath $env:RETAILLENS_STORE_STATE_PATH -Round 2

      - name: Full independent cleanup including package, private key, certificate, candidate, records, and run root
        if: always()
        shell: pwsh
        run: ./scripts/windows-store-cleanup.ps1 -StatePath $env:RETAILLENS_STORE_STATE_PATH -IdentityName $env:RETAILLENS_STORE_IDENTITY_NAME

      - name: Record canonical non-artifact outcome
        if: always()
        shell: pwsh
        run: |
          @(
            '## Retail Decision Studio Store validation',
            '',
            "- Product ID: $env:RETAILLENS_STORE_PRODUCT_ID",
            "- Identity.Name: $env:RETAILLENS_STORE_IDENTITY_NAME",
            "- Publisher: $env:RETAILLENS_STORE_PUBLISHER",
            "- Workflow result: ${{ job.status }}",
            '- Candidate/evidence artifact upload: none',
            '- WACK JSON records were private same-run consistency records, not cryptographic attestations, and were destroyed during cleanup.'
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
